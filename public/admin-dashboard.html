<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Himagiri Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
</head>
<body>

    <div class="dashboard-container">
        <nav class="sidebar">
            <div class="logo">HG Admin</div>
            <ul>
                <li id="nav-photos" class="active"><i class="fas fa-camera"></i> Photography</li>
                <li id="nav-videos"><i class="fas fa-video"></i> Videos</li>
                <li id="nav-projects"><i class="fas fa-project-diagram"></i> Projects</li>
                <li id="nav-about"><i class="fas fa-user-circle"></i> About Photo</li>
                <li id="nav-abouttext"><i class="fas fa-address-card"></i> About Content</li>
                <li class="logout-link"><a href="#" id="logoutBtn"><i class="fas fa-sign-out-alt"></i> Logout</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <header class="content-header">
                <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
                    <div>
                        <h2 id="page-title">Manage Photography</h2>
                        <p>Upload and manage your content dynamically.</p>
                    </div>
                    <div id="sessionTimer" class="session-timer"><i class="fas fa-clock"></i> <span id="sessionTimerText">--:--</span></div>
                </div>
            </header>

            <div id="toolsBar" class="tools-bar" hidden></div>

            <section class="upload-section">
                <div class="upload-card" id="uploadCard">
                    <h3><i class="fas fa-cloud-upload-alt"></i> Upload New Media</h3>
                    
                    <form id="uploadForm">
                        <div class="input-box" id="titleBox">
                            <label id="titleLabel">Title / Project Name</label>
                            <input type="text" id="mediaTitle" placeholder="Enter title...">
                        </div>
                        
                        <div id="projectFields" style="display: none;">
                            <div class="input-box">
                                <label>Card Label (small tag, e.g. Live Project)</label>
                                <input type="text" id="projTag" placeholder="Live Project">
                            </div>

                            <div class="input-box">
                                <label>Description</label>
                                <textarea id="projDesc" rows="3" placeholder="Write about the project..." 
                                style="width:100%; background:#0f172a; color:white; border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px; outline:none;"></textarea>
                            </div>

                            <div class="input-box">
                                <label>Tech Stack (Comma separated)</label>
                                <input type="text" id="projTech" placeholder="Ex: React, Node.js, MongoDB">
                            </div>

                            <div class="input-box">
                                <label>Live Demo Link</label>
                                <input type="text" id="projLive" placeholder="https://your-project.com">
                            </div>

                            <div class="input-box">
                                <label>GitHub Repo Link</label>
                                <input type="text" id="projRepo" placeholder="https://github.com/...">
                            </div>

                            <div class="input-box" style="display:flex; align-items:center; gap:10px;">
                                <input type="checkbox" id="projFeatured" style="width:auto;">
                                <label for="projFeatured" style="margin:0;">⭐ Show on the homepage slider</label>
                            </div>
                        </div>

                        <div class="input-box">
                            <label id="fileLabel">Choose Files</label>
                            <input type="file" id="mediaFile" accept="image/*" multiple>
                            <small id="fileHint" style="color:#64748b; display:block; margin-top:6px;"></small>
                        </div>

                        <button type="submit" class="submit-btn" id="formSubmitBtn">Upload to Live Site</button>
                        <button type="button" id="cancelEditBtn" class="submit-btn" style="display:none; background:#475569; margin-top:8px;">Cancel Edit</button>
                    </form>
                </div>

                <div class="upload-card" id="aboutCard" style="display:none;">
                    <h3 id="aboutCardTitle"><i class="fas fa-pen"></i> Add About Content</h3>
                    <form id="aboutForm">
                        <div class="input-box" id="aboutKindBox">
                            <label>Type</label>
                            <select id="aboutKind">
                                <option value="paragraph">Paragraph</option>
                                <option value="stat">Info card (Role, Education...)</option>
                            </select>
                        </div>
                        <div class="input-box" id="aboutLabelBox" style="display:none;">
                            <label>Card Label (e.g. Role:)</label>
                            <input type="text" id="aboutLabel" placeholder="Role:">
                        </div>
                        <div class="input-box">
                            <label id="aboutTextLabel">Text</label>
                            <textarea id="aboutText" rows="5" placeholder="Write here..."
                                style="width:100%; background:#0f172a; color:white; border:1px solid rgba(255,255,255,0.1); border-radius:10px; padding:10px; outline:none;"></textarea>
                            <small id="aboutHint" style="color:#64748b; display:block; margin-top:6px;">Tip: **bold text** and *italic text* work inside paragraphs.</small>
                        </div>
                        <button type="submit" class="submit-btn" id="aboutSubmitBtn">Add to About</button>
                        <button type="button" id="aboutCancelBtn" class="submit-btn" style="display:none; background:#475569; margin-top:8px;">Cancel Edit</button>
                    </form>
                </div>
            </section>

            <section class="recent-uploads">
                <h3 id="gridTitle">Recent Uploads</h3>
                <div class="preview-grid">
                    </div>
            </section>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/toast.js"></script>
<script src="js/admin-script.js"></script>

</body>
</html>
