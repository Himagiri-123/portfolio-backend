<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Gallery - Himagiri</title>
    <link rel="preconnect" href="https://res.cloudinary.com">
    <link rel="preconnect" href="https://himagiri-portfolio.onrender.com">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        .gallery-header { text-align: center; padding: 40px 20px 10px; color: white; }
        .gallery-header h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(to right, #00d2ff, #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

        /* Grid size switcher */
        .view-switch { display: flex; justify-content: center; gap: 8px; padding: 10px 20px 0; }
        .view-switch button { background: rgba(255,255,255,0.06); color: #cbd5e1; border: 1px solid rgba(255,255,255,0.15); padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; transition: 0.2s; }
        .view-switch button.active, .view-switch button:hover { background: #00d2ff; border-color: #00d2ff; color: #0f172a; }

        .gallery-container { display: grid; gap: 18px; padding: 20px 5% 60px; --min: 200px; --h: 160px; grid-template-columns: repeat(auto-fill, minmax(var(--min), 1fr)); }
        .gallery-container.view-small { --min: 120px; --h: 120px; gap: 10px; }
        .gallery-container.view-medium { --min: 200px; --h: 160px; }
        .gallery-container.view-large { --min: 300px; --h: 220px; gap: 25px; }

        .gallery-item { position: relative; border-radius: 12px; overflow: hidden; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; cursor: pointer; }
        .gallery-item:hover, .gallery-item:focus-visible { transform: translateY(-4px); border-color: #00d2ff; outline: none; }
        .gallery-item img, .gallery-item video { display: block; width: 100%; height: var(--h); object-fit: cover; background: #0b1220; }
        .gallery-info { padding: 10px; text-align: center; color: #cbd5e1; }
        .gallery-info h3 { font-size: 0.9rem; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .view-small .gallery-info { position: absolute; left: 0; right: 0; bottom: 0; padding: 14px 6px 5px; background: linear-gradient(transparent, rgba(0,0,0,0.8)); }
        .view-small .gallery-info h3 { font-size: 0.7rem; color: #fff; }
        .play-badge { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border-radius: 50%; background: rgba(0,0,0,0.6); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; pointer-events: none; }

        .status-msg { grid-column: 1 / -1; text-align: center; color: #94a3b8; padding: 40px 10px; }
        .spinner { width: 34px; height: 34px; margin: 0 auto 14px; border: 3px solid rgba(255,255,255,0.15); border-top-color: #00d2ff; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* Lightbox */
        .lightbox { display: none; position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.95); }
        .lightbox.open { display: block; }
        .lb-stage { position: absolute; inset: 64px 76px 54px; display: flex; align-items: center; justify-content: center; }
        .lb-stage img, .lb-stage video { max-width: 100%; max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 8px; box-shadow: 0 0 24px rgba(0,210,255,0.35); transition: opacity 0.2s; }
        .lb-stage img.loading { opacity: 0.25; }
        .lb-topbar { position: absolute; top: 0; left: 0; right: 0; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 18px; color: #e2e8f0; z-index: 2; }
        .lb-actions { display: flex; gap: 8px; }
        .lb-btn { background: rgba(255,255,255,0.12); color: #fff; border: none; width: 40px; height: 40px; border-radius: 50%; font-size: 1rem; cursor: pointer; transition: 0.2s; }
        .lb-btn:hover { background: #00d2ff; color: #0f172a; }
        .lb-nav { position: absolute; top: 50%; transform: translateY(-50%); width: 48px; height: 48px; font-size: 1.2rem; z-index: 2; }
        .lb-prev { left: 14px; }
        .lb-next { right: 14px; }
        .lb-caption { position: absolute; bottom: 14px; left: 0; right: 0; text-align: center; color: #cbd5e1; font-size: 0.95rem; padding: 0 70px; }
        .lightbox:fullscreen .lb-stage { inset: 0; }
        .lightbox:fullscreen .lb-stage img, .lightbox:fullscreen .lb-stage video { border-radius: 0; box-shadow: none; }
        .lightbox:fullscreen .lb-caption { display: none; }
        .lightbox.maximized .lb-stage { inset: 0; }
        @media (max-width: 600px) {
            .lb-stage { inset: 56px 0 50px; }
            .lb-nav { width: 40px; height: 40px; background: rgba(0,0,0,0.5); }
            .lb-prev { left: 6px; } .lb-next { right: 6px; }
            .gallery-container.view-large { --min: 220px; }
        }

        .back-nav { position: fixed; top: 20px; left: 20px; z-index: 100; }
        .back-btn { text-decoration: none; color: white; background: rgba(0,0,0,0.5); padding: 10px 20px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); transition: 0.3s; }
        .back-btn:hover { background: #00d2ff; border-color: #00d2ff; }
    </style>
</head>
<body>

    <div class="back-nav">
        <a href="index.html#skills" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Skills</a>
    </div>

    <div class="gallery-header">
        <h1 id="page-title">Loading...</h1>
        <p id="page-desc">Here are some of my best works.</p>
    </div>

    <div class="view-switch" id="viewSwitch">
        <button data-view="small"><i class="fas fa-th"></i> Small</button>
        <button data-view="medium"><i class="fas fa-th-large"></i> Medium</button>
        <button data-view="large"><i class="fas fa-square"></i> Large</button>
    </div>

    <div class="gallery-container view-medium" id="gallery">
        <div class="status-msg"><div class="spinner"></div>Loading gallery... the server may take a few seconds to wake up.</div>
    </div>

    <div id="lightbox" class="lightbox" aria-hidden="true">
        <div class="lb-topbar">
            <span id="lbCounter"></span>
            <div class="lb-actions">
                <button class="lb-btn" id="lbFullscreen" title="Fullscreen (F)"><i class="fas fa-expand"></i></button>
                <button class="lb-btn" id="lbClose" title="Close (Esc)"><i class="fas fa-times"></i></button>
            </div>
        </div>
        <button class="lb-btn lb-nav lb-prev" id="lbPrev" title="Previous"><i class="fas fa-chevron-left"></i></button>
        <div class="lb-stage" id="lbStage">
            <img id="lbImg" alt="">
            <video id="lbVideo" controls playsinline></video>
        </div>
        <button class="lb-btn lb-nav lb-next" id="lbNext" title="Next"><i class="fas fa-chevron-right"></i></button>
        <div class="lb-caption" id="lbCaption"></div>
    </div>

    <script src="js/api.js"></script>
    <script>
        const params = new URLSearchParams(window.location.search);
        const isVideos = params.get('type') === 'videos';

        const gallery = document.getElementById('gallery');
        const lightbox = document.getElementById('lightbox');
        const lbImg = document.getElementById('lbImg');
        const lbVideo = document.getElementById('lbVideo');
        const lbCounter = document.getElementById('lbCounter');
        const lbCaption = document.getElementById('lbCaption');

        let items = [];
        let currentIndex = 0;

        // ---------- Page setup ----------
        document.getElementById('page-title').innerText = isVideos ? 'Cinematic Video Edits 🎬' : 'Creative Photography 📸';
        document.getElementById('page-desc').innerText = isVideos ? 'A collection of my video editing experiments.' : 'Capturing moments through my lens.';
        document.title = isVideos ? 'My Videos - Himagiri' : 'My Photography - Himagiri';

        // ---------- Grid size switcher ----------
        const viewButtons = document.querySelectorAll('#viewSwitch button');
        function setView(view) {
            gallery.classList.remove('view-small', 'view-medium', 'view-large');
            gallery.classList.add(`view-${view}`);
            viewButtons.forEach(btn => btn.classList.toggle('active', btn.dataset.view === view));
            try { localStorage.setItem('galleryView', view); } catch (e) { /* storage blocked */ }
        }
        viewButtons.forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
        setView(localStorage.getItem('galleryView') || 'medium');

        // ---------- Rendering ----------
        function belongsToPage(item) {
            const wanted = isVideos ? 'Videos' : 'Photography';
            if (item.category) return item.category === wanted;
            return item.mediaType === (isVideos ? 'video' : 'image');
        }

        function renderGallery(data) {
            items = data.filter(belongsToPage);
            gallery.innerHTML = '';

            if (items.length === 0) {
                gallery.innerHTML = '<p class="status-msg">No content found yet.</p>';
                return;
            }

            const fragment = document.createDocumentFragment();
            items.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'gallery-item';
                card.tabIndex = 0;
                card.dataset.index = index;

                const media = item.mediaType === 'video'
                    ? `<video src="${item.url}#t=0.1" poster="${videoPoster(item.url)}" preload="metadata" muted playsinline></video><span class="play-badge"><i class="fas fa-play"></i></span>`
                    : `<img src="${optimizedImage(item.url, 600)}" alt="${escapeHtml(item.title)}" loading="lazy" decoding="async">`;

                card.innerHTML = `${media}<div class="gallery-info"><h3>${escapeHtml(item.title)}</h3></div>`;
                fragment.appendChild(card);
            });
            gallery.appendChild(fragment);
        }

        gallery.addEventListener('click', (e) => {
            const card = e.target.closest('.gallery-item');
            if (card) openLightbox(Number(card.dataset.index));
        });
        gallery.addEventListener('keydown', (e) => {
            const card = e.target.closest('.gallery-item');
            if (card && e.key === 'Enter') openLightbox(Number(card.dataset.index));
        });

        loadMedia(renderGallery).catch((error) => {
            console.error('Gallery error:', error);
            gallery.innerHTML = '<p class="status-msg" style="color:#f87171;">Unable to load gallery. Please try again later.</p>';
        });

        // ---------- Lightbox ----------
        function showItem(index) {
            currentIndex = (index + items.length) % items.length;
            const item = items[currentIndex];

            lbVideo.pause();
            lbVideo.removeAttribute('src');
            lbVideo.load();

            if (item.mediaType === 'video') {
                lbImg.style.display = 'none';
                lbVideo.style.display = 'block';
                lbVideo.src = item.url;
                lbVideo.play().catch(() => {});
            } else {
                lbVideo.style.display = 'none';
                lbImg.style.display = 'block';
                lbImg.classList.add('loading');
                lbImg.onload = () => lbImg.classList.remove('loading');
                lbImg.src = optimizedImage(item.url, 1600);
                preloadNeighbours();
            }

            lbCounter.textContent = `${currentIndex + 1} / ${items.length}`;
            lbCaption.textContent = item.title || '';
            document.getElementById('lbPrev').style.visibility = document.getElementById('lbNext').style.visibility = items.length > 1 ? 'visible' : 'hidden';
        }

        function preloadNeighbours() {
            [currentIndex - 1, currentIndex + 1].forEach((i) => {
                const neighbour = items[(i + items.length) % items.length];
                if (neighbour && neighbour.mediaType !== 'video') new Image().src = optimizedImage(neighbour.url, 1600);
            });
        }

        function openLightbox(index) {
            lightbox.classList.add('open');
            lightbox.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
            showItem(index);
        }

        function closeLightbox() {
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            lightbox.classList.remove('open', 'maximized');
            lightbox.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
            lbVideo.pause();
            lbVideo.removeAttribute('src');
            lbVideo.load();
        }

        function toggleFullscreen() {
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(() => {});
            } else if (lightbox.requestFullscreen) {
                lightbox.requestFullscreen().catch(() => lightbox.classList.toggle('maximized'));
            } else if (lbVideo.style.display === 'block' && lbVideo.webkitEnterFullscreen) {
                lbVideo.webkitEnterFullscreen(); // iPhone Safari only supports fullscreen on video
            } else {
                lightbox.classList.toggle('maximized');
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const icon = document.querySelector('#lbFullscreen i');
            icon.className = document.fullscreenElement ? 'fas fa-compress' : 'fas fa-expand';
        });

        document.getElementById('lbClose').addEventListener('click', closeLightbox);
        document.getElementById('lbFullscreen').addEventListener('click', toggleFullscreen);
        document.getElementById('lbPrev').addEventListener('click', () => showItem(currentIndex - 1));
        document.getElementById('lbNext').addEventListener('click', () => showItem(currentIndex + 1));
        document.getElementById('lbStage').addEventListener('click', (e) => { if (e.target.id === 'lbStage') closeLightbox(); });

        document.addEventListener('keydown', (e) => {
            if (!lightbox.classList.contains('open')) return;
            if (e.key === 'ArrowRight') showItem(currentIndex + 1);
            else if (e.key === 'ArrowLeft') showItem(currentIndex - 1);
            else if (e.key === 'Escape') closeLightbox();
            else if (e.key.toLowerCase() === 'f') toggleFullscreen();
        });

        // Mouse wheel / trackpad scroll moves between items
        let wheelLocked = false;
        lightbox.addEventListener('wheel', (e) => {
            if (wheelLocked || Math.abs(e.deltaY) < 20) return;
            wheelLocked = true;
            showItem(currentIndex + (e.deltaY > 0 ? 1 : -1));
            setTimeout(() => { wheelLocked = false; }, 450);
        }, { passive: true });

        // Swipe left/right on touch screens
        let touchStartX = 0, touchStartY = 0, touchIgnored = false;
        lightbox.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            // Dragging the video's seek bar must not count as a swipe
            const rect = lbVideo.getBoundingClientRect();
            touchIgnored = e.target === lbVideo && touch.clientY > rect.top + rect.height * 0.75;
        }, { passive: true });
        lightbox.addEventListener('touchend', (e) => {
            if (touchIgnored) return;
            const touch = e.changedTouches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;
            if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy)) showItem(currentIndex + (dx < 0 ? 1 : -1));
        }, { passive: true });
    </script>
</body>
</html>
